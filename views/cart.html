<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — LIBAS</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/cart.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav__logo">LIB<span>A</span>S</a>
    <ul class="nav__links">
      <li><a href="/">Home</a></li>
      <li><a href="/shop">Shop</a></li>
      <li><a href="/shop?category=Men">Men</a></li>
      <li><a href="/shop?category=Women">Women</a></li>
      <li><a href="/shop?category=Kids">Kids</a></li>
    </ul>
    <div class="nav__actions">
      <a href="/cart" class="nav__cart">Cart <span class="cart-badge" id="cart-count">0</span></a>
    </div>
  </nav>
</header>

<div class="container">
  <div id="cart-root"></div>
</div>

<footer class="site-footer">
  <div class="footer__inner">
    <span class="footer__logo">LIB<span>A</span>S</span>
    <ul class="footer__links">
      <li><a href="#">Shipping</a></li>
      <li><a href="#">Returns</a></li>
      <li><a href="#">Size Guide</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <span class="footer__copy">© 2026 Libas. All rights reserved.</span>
  </div>
</footer>

<script src="/js/cart.js"></script>
<script>
  function renderCartPage() {
    const cart = getCart();
    const root = document.getElementById('cart-root');

    if (cart.length === 0) {
      root.innerHTML = `
        <div class="cart-page">
          <div class="empty-cart">
            <div class="empty-cart__icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p>Looks like you haven't added anything yet.</p>
            <a href="/shop" class="btn btn--primary">Browse Collection</a>
          </div>
        </div>
      `;
      return;
    }

    const shipping = 250;
    const subtotal = cartTotal(cart);
    const total    = subtotal + shipping;

    const itemsHTML = cart.map(item => `
      <div class="cart-item" data-id="${item.productId}" data-size="${item.size}">
        <div class="cart-item__img">
          <img src="${item.image}" alt="${item.name}" />
        </div>
        <div class="cart-item__details">
          <div class="cart-item__name">${item.name}</div>
          <div class="cart-item__meta">Size: ${item.size}</div>
          <div class="cart-item__qty">
            <button class="qty-dec">−</button>
            <span>${item.qty}</span>
            <button class="qty-inc">+</button>
          </div>
        </div>
        <div class="cart-item__right">
          <div class="cart-item__price">PKR ${(item.price * item.qty).toLocaleString('en-PK')}</div>
          <button class="cart-item__remove">Remove</button>
        </div>
      </div>
    `).join('');

    root.innerHTML = `
      <div class="cart-page">
        <div class="cart-items-col">
          <h1 class="cart-page__title">Your Cart</h1>
          <div class="cart-items" id="cart-items">
            ${itemsHTML}
          </div>
          <a href="/shop" style="display:inline-block;margin-top:24px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;">← Continue Shopping</a>
        </div>

        <div class="order-summary">
          <div class="order-summary__title">Order Summary</div>
          <div class="summary-row">
            <span class="summary-row__label">Subtotal (${cart.reduce((s,i)=>s+i.qty,0)} items)</span>
            <span>PKR ${subtotal.toLocaleString('en-PK')}</span>
          </div>
          <div class="summary-row">
            <span class="summary-row__label">Shipping</span>
            <span>PKR ${shipping.toLocaleString('en-PK')}</span>
          </div>
          <div class="summary-row summary-row--total">
            <span class="summary-row__label">Total</span>
            <span class="summary-row__value">PKR ${total.toLocaleString('en-PK')}</span>
          </div>
          <button class="btn btn--accent btn--full" style="margin-top:20px;" onclick="alert('Wire this button to your backend checkout/order route.')">
            Checkout
          </button>
          <p class="checkout-note">Secure checkout. Free returns within 30 days.</p>
        </div>
      </div>
    `;

    // Remove buttons
    document.querySelectorAll('.cart-item__remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.cart-item');
        removeFromCart(parseInt(item.dataset.id), item.dataset.size);
        renderCartPage();
      });
    });

    // Qty controls
    document.querySelectorAll('.qty-dec').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.cart-item');
        const cur  = parseInt(btn.nextElementSibling.textContent);
        updateQty(parseInt(item.dataset.id), item.dataset.size, cur - 1);
        renderCartPage();
      });
    });

    document.querySelectorAll('.qty-inc').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.cart-item');
        const cur  = parseInt(btn.previousElementSibling.textContent);
        updateQty(parseInt(item.dataset.id), item.dataset.size, cur + 1);
        renderCartPage();
      });
    });
  }

  document.addEventListener('DOMContentLoaded', renderCartPage);
</script>
</body>
</html>
