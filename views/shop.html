<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — LIBAS</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="/" class="nav__logo">LIB<span>A</span>S</a>
    <ul class="nav__links">
      <li><a href="/">Home</a></li>
      <li><a href="/shop" class="active">Shop</a></li>
      <li><a href="/shop?category=Men">Men</a></li>
      <li><a href="/shop?category=Women">Women</a></li>
      <li><a href="/shop?category=Kids">Kids</a></li>
    </ul>
    <div class="nav__actions">
      <a href="/cart" class="nav__cart">Cart <span class="cart-badge" id="cart-count">0</span></a>
    </div>
  </nav>
</header>

<div class="container">

  <div class="shop-header">
    <h1 class="shop-header__title">The Collection</h1>
    <p class="shop-header__meta" id="result-count">Loading…</p>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-bar__cats" id="cat-filters">
      <button class="filter-chip active" data-cat="all">All</button>
      <button class="filter-chip" data-cat="Men">Men</button>
      <button class="filter-chip" data-cat="Women">Women</button>
      <button class="filter-chip" data-cat="Kids">Kids</button>
      <button class="filter-chip" data-cat="Unstitched">Unstitched</button>
      <button class="filter-chip" data-cat="Accessories">Accessories</button>
    </div>
    <div class="filter-bar__right">
      <div class="filter-bar__sort">
        <label for="sort-select">Sort</label>
        <select id="sort-select">
          <option value="">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name A–Z</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Product grid -->
  <div class="shop-grid" id="shop-grid">
    <div class="loading">Loading products…</div>
  </div>

</div>

<footer class="site-footer">
  <div class="footer__inner">
    <span class="footer__logo">LIB<span>A</span>S</span>
    <ul class="footer__links">
      <li><a href="#">Shipping</a></li>
      <li><a href="#">Returns</a></li>
      <li><a href="#">Size Guide</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <span class="footer__copy">© 2026 Libas. All rights reserved.</span>
  </div>
</footer>

<script src="/js/cart.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
